<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelankarx Assistant</title>
    <style>
        /* Base Styles */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* Floating Toggle Button */
        #chat-toggle {
            position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px;
            background: #2563eb; border-radius: 50%; border: none; cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); z-index: 9999;
            display: flex; align-items: center; justify-content: center; transition: transform 0.2s;
        }
        #chat-toggle:hover { transform: scale(1.05); }
        #chat-toggle svg { width: 28px; height: 28px; fill: white; }

        /* Chat Window */
        #chat-window {
            position: fixed; bottom: 100px; right: 24px; width: 380px; height: 550px;
            background: #0f172a; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            display: none; flex-direction: column; overflow: hidden; z-index: 9999;
            border: 1px solid #1e293b;
        }
        
        /* Header */
        #chat-header {
            background: #1e293b; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155;
        }
        #chat-header h3 { margin: 0; color: white; font-size: 16px; font-weight: 600; }
        #close-chat { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 20px; }
        #close-chat:hover { color: white; }

        /* Messages Area */
        #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 80%; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }

        /* Input Area */
        #input-area { display: flex; padding: 12px; border-top: 1px solid #334155; background: #0f172a; }
        #user-input { flex: 1; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: white; outline: none; font-size: 14px; }
        #user-input:focus { border-color: #2563eb; }
        #send-btn { margin-left: 8px; padding: 12px 16px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        #send-btn:hover { background: #1d4ed8; }
        #send-btn:disabled { background: #475569; cursor: not-allowed; }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            #chat-window { width: calc(100vw - 32px); height: 70vh; right: 16px; bottom: 90px; }
            #chat-toggle { bottom: 16px; right: 16px; }
        }
    </style>
</head>
<body>

    <!-- Floating Toggle Button -->
    <button id="chat-toggle" onclick="toggleChat()">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>

    <!-- Chat Window -->
    <div id="chat-window">
        <div id="chat-header">
            <h3>Freelankarx Assistant</h3>
            <button id="close-chat" onclick="toggleChat()">✕</button>
        </div>
        <div id="messages">
            <div class="msg bot">Hello! 👋 I'm the Freelankarx AI assistant. How can we help scale your brand today?</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask about services, pricing, or timelines..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR ACTUAL RENDER URL + /chat
        const BACKEND_URL = "https://YOUR_RENDER_URL_HERE.onrender.com/chat"; 

        function toggleChat() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = inputField.value.trim();
            if (!text) return;

            const messagesDiv = document.getElementById('messages');
            
            // Add user message
            messagesDiv.innerHTML += `<div class="msg user">${text}</div>`;
            inputField.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Add loading indicator
            const loadingId = 'loading-' + Date.now();
            messagesDiv.innerHTML += `<div class="msg bot" id="${loadingId}">Thinking...</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // Disable input while loading
            inputField.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                // Replace loading with actual response
                document.getElementById(loadingId).innerText = data.response;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById(loadingId).innerText = "I'm having a little trouble connecting right now. Please try again in a moment, or reach out via WhatsApp!";
            }

            // Re-enable input
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
