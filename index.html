<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelankarx Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: transparent;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Chat Button - Always visible at bottom-right */
        #chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10000;
        }

        #chat-button:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6);
        }

        #chat-button:active {
            transform: scale(0.95);
        }

        #chat-button svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        /* Chat Window - Hidden by default */
        #chat-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            height: 520px;
            background: #1a1f2e;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 10000;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header */
        #chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        #chat-header h3 {
            margin: 0;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        #chat-header .status {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 4px;
        }

        #close-chat {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #close-chat:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }

        /* Messages Area */
        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #1a1f2e;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: messageIn 0.3s ease-out;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #252b3d;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        #input-area {
            display: flex;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: #1a1f2e;
            gap: 8px;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            background: #252b3d;
            color: white;
            outline: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        #user-input:focus {
            border-color: #667eea;
            background: #2a3045;
        }

        #user-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        #send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Mobile Responsive - Full Screen */
        @media (max-width: 768px) {
            #chat-container {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: 100vh;
                border-radius: 0;
                animation: none;
            }

            #chat-button {
                bottom: 20px;
                right: 20px;
            }
        }

        /* Hide button when chat is open on mobile */
        @media (max-width: 768px) {
            #chat-container.active + #chat-button {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Chat Window -->
    <div id="chat-container">
        <div id="chat-header">
            <div>
                <h3>Freelankarx Assistant</h3>
                <div class="status">● Online</div>
            </div>
            <button id="close-chat" onclick="toggleChat()">✕</button>
        </div>
        <div id="messages">
            <div class="msg bot">Hello! 👋 I'm the Freelankarx AI assistant. How can we help scale your brand today?</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask about services, pricing, or timelines..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Chat Button -->
    <button id="chat-button" onclick="toggleChat()" aria-label="Open chat">
        <svg viewBox="0 0 24 24">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
    </button>

    <script>
        const BACKEND_URL = "https://freelankarx-chatbot-backend.onrender.com/chat";
        let isChatOpen = false;

        function toggleChat() {
            const chatContainer = document.getElementById('chat-container');
            isChatOpen = !isChatOpen;
            
            if (isChatOpen) {
                chatContainer.style.display = 'flex';
                chatContainer.classList.add('active');
                // Notify parent iframe to resize
                window.parent.postMessage({ type: 'chat-opened' }, '*');
            } else {
                chatContainer.style.display = 'none';
                chatContainer.classList.remove('active');
                // Notify parent iframe to resize back
                window.parent.postMessage({ type: 'chat-closed' }, '*');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = inputField.value.trim();
            if (!text) return;

            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += `<div class="msg user">${text}</div>`;
            inputField.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            messagesDiv.innerHTML += `<div class="msg bot" id="${loadingId}">Thinking...</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            inputField.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                document.getElementById(loadingId).innerText = data.response;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById(loadingId).innerText = "I'm having a little trouble connecting right now. Please try again in a moment, or reach out via WhatsApp!";
            }

            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
