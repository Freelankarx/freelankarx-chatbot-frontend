<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelankarx Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: transparent;
            height: 100vh;
            overflow: hidden;
        }

        #chat-toggle {
            position: fixed; bottom: 24px; right: 24px; 
            width: 60px; height: 60px;
            background: #2563eb; border-radius: 50%; border: none; cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4); z-index: 10000;
            display: flex; align-items: center; justify-content: center; 
            transition: all 0.3s ease;
        }
        #chat-toggle:hover { transform: scale(1.05); }
        #chat-toggle.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
        }
        #chat-toggle svg { width: 28px; height: 28px; fill: white; }

        #chat-window {
            position: fixed; bottom: 96px; right: 24px; 
            width: 400px; max-height: 75vh;
            background: #0f172a; border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: none; flex-direction: column; overflow: hidden; z-index: 10000;
            border: 1px solid #1e293b;
        }

        #chat-window.open { display: flex; }

        #chat-header {
            background: #1e293b; padding: 16px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155;
        }
        #chat-header h3 { color: white; font-size: 16px; font-weight: 600; }
        #close-chat { 
            background: transparent; border: none; color: #94a3b8; 
            cursor: pointer; font-size: 24px; width: 32px; height: 32px;
        }
        #close-chat:hover { color: white; }

        #messages { 
            flex: 1; padding: 16px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 12px; 
        }

        .msg { 
            padding: 12px 16px; border-radius: 12px; max-width: 85%; 
            font-size: 14px; line-height: 1.5; word-wrap: break-word; 
        }
        .user { background: #2563eb; color: white; align-self: flex-end; }
        .bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border: 1px solid #334155; }

        .typing-indicator { display: flex; gap: 4px; padding: 16px !important; }
        .typing-indicator span {
            width: 8px; height: 8px; background: #94a3b8;
            border-radius: 50%; animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        #quick-replies {
            display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto;
            scrollbar-width: none;
        }
        #quick-replies::-webkit-scrollbar { display: none; }
        .quick-reply-pill {
            padding: 8px 16px; background: #1e293b; border: 1px solid #334155;
            border-radius: 999px; color: white; font-size: 13px; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .quick-reply-pill:hover { background: #2563eb; border-color: #2563eb; }

        #input-area { 
            display: flex; padding: 16px; border-top: 1px solid #334155; 
            background: #0f172a; gap: 8px; align-items: center;
        }
        #user-input { 
            flex: 1; padding: 12px 16px; border: 1px solid #334155; 
            border-radius: 24px; background: #1e293b; color: white; 
            outline: none; font-size: 14px; resize: none; max-height: 120px;
        }
        #user-input:focus { border-color: #2563eb; }
        #send-btn { 
            padding: 12px 20px; background: #2563eb; color: white; border: none; 
            border-radius: 24px; cursor: pointer; font-weight: 600;
        }
        #send-btn:hover { background: #1d4ed8; }
        #send-btn:disabled { background: #475569; cursor: not-allowed; }

        @media (max-width: 768px) {
            #chat-window {
                width: 100%; height: 100vh; max-height: 100vh;
                bottom: 0; right: 0; border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div id="chat-window">
        <div id="chat-header">
            <h3>Freelankarx Assistant</h3>
            <button id="close-chat" onclick="toggleChat()">✕</button>
        </div>
        
        <div id="messages"></div>

        <div id="quick-replies">
            <button class="quick-reply-pill" onclick="sendQuickReply('What are your services?')">💼 Services</button>
            <button class="quick-reply-pill" onclick="sendQuickReply('How much does it cost?')">💰 Pricing</button>
            <button class="quick-reply-pill" onclick="sendQuickReply('Show me portfolio')">🎨 Portfolio</button>
        </div>

        <div id="input-area">
            <textarea id="user-input" placeholder="Ask about services..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <button id="chat-toggle" onclick="toggleChat()">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>

    <script>
        const BACKEND_URL = "https://freelankarx-chatbot-backend.onrender.com/chat";
        let isChatOpen = false;
        let hasSentMessage = false;

        function toggleChat() {
            isChatOpen = !isChatOpen;
            const chatWindow = document.getElementById('chat-window');
            const chatToggle = document.getElementById('chat-toggle');
            
            if (isChatOpen) {
                chatWindow.classList.add('open');
                chatToggle.classList.add('hidden'); // Hide toggle button
                document.getElementById('user-input').focus();
                if (!hasSentMessage) {
                    appendMessage('bot', "Hello! 👋 I'm the Freelankarx AI assistant. How can we help scale your brand today?");
                }
            } else {
                chatWindow.classList.remove('open');
                chatToggle.classList.remove('hidden'); // Show toggle button
            }
        }

        function appendMessage(role, text) {
            const messagesDiv = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.textContent = text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendQuickReply(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = inputField.value.trim();
            if (!text) return;

            hasSentMessage = true;
            document.getElementById('quick-replies').style.display = 'none';
            
            appendMessage('user', text);
            inputField.value = '';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg bot typing-indicator';
            loadingDiv.innerHTML = '<span></span><span></span><span></span>';
            document.getElementById('messages').appendChild(loadingDiv);

            inputField.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                loadingDiv.remove();
                appendMessage('bot', data.response);
            } catch (error) {
                loadingDiv.remove();
                appendMessage('bot', "Having trouble connecting. Please try again!");
            }

            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
