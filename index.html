<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelankarx Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: transparent;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            overflow: hidden;
        }
        
        /* Chat Window - Hidden by default with smooth animation */
        #chat-window {
            width: 380px; 
            height: 520px;
            background: #0f172a; 
            border-radius: 16px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            display: none; 
            flex-direction: column; 
            overflow: hidden; 
            border: 1px solid #1e293b;
            margin-bottom: 16px;
            margin-right: 24px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Floating Toggle Button */
        #chat-toggle {
            width: 60px; 
            height: 60px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-radius: 50%; 
            border: none; 
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.3s ease;
            margin-bottom: 24px;
            margin-right: 24px;
        }
        
        #chat-toggle:hover { 
            transform: scale(1.1);
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.6);
        }
        
        #chat-toggle:active {
            transform: scale(0.95);
        }
        
        #chat-toggle svg { 
            width: 28px; 
            height: 28px; 
            fill: white; 
        }

        /* Header */
        #chat-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            padding: 16px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #334155;
        }
        
        #chat-header h3 { 
            margin: 0; 
            color: white; 
            font-size: 16px; 
            font-weight: 600; 
        }
        
        #close-chat { 
            background: none; 
            border: none; 
            color: #94a3b8; 
            cursor: pointer; 
            font-size: 20px;
            transition: color 0.2s;
        }
        
        #close-chat:hover { 
            color: white; 
        }

        /* Messages Area */
        #messages { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #334155 #0f172a;
        }
        
        #messages::-webkit-scrollbar {
            width: 6px;
        }
        
        #messages::-webkit-scrollbar-track {
            background: #0f172a;
        }
        
        #messages::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        
        .msg { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 80%; 
            font-size: 14px; 
            line-height: 1.5; 
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .user { 
            background: #2563eb; 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 4px; 
        }
        
        .bot { 
            background: #1e293b; 
            color: #e2e8f0; 
            align-self: flex-start; 
            border-bottom-left-radius: 4px; 
            border: 1px solid #334155; 
        }

        /* Input Area */
        #input-area { 
            display: flex; 
            padding: 12px; 
            border-top: 1px solid #334155; 
            background: #0f172a; 
        }
        
        #user-input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: #1e293b; 
            color: white; 
            outline: none; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        
        #user-input:focus { 
            border-color: #2563eb; 
        }
        
        #send-btn { 
            margin-left: 8px; 
            padding: 12px 16px; 
            background: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.2s;
        }
        
        #send-btn:hover { 
            background: #1d4ed8;
            transform: translateY(-1px);
        }
        
        #send-btn:disabled { 
            background: #475569; 
            cursor: not-allowed;
            transform: none;
        }

        /* Mobile Responsive - Full screen on mobile */
        @media (max-width: 480px) {
            #chat-window { 
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: 100vh;
                border-radius: 0;
                margin: 0;
                z-index: 10001;
            }
            
            #chat-toggle { 
                margin-right: 16px;
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Chat Window - Hidden by default -->
    <div id="chat-window">
        <div id="chat-header">
            <h3>Freelankarx Assistant</h3>
            <button id="close-chat" onclick="toggleChat()">✕</button>
        </div>
        <div id="messages">
            <div class="msg bot">Hello! 👋 I'm the Freelankarx AI assistant. How can we help scale your brand today?</div>
        </div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Ask about services, pricing, or timelines..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Floating Toggle Button -->
    <button id="chat-toggle" onclick="toggleChat()" aria-label="Open chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </button>

    <script>
        const BACKEND_URL = "https://freelankarx-chatbot-backend.onrender.com/chat"; 

        function toggleChat() {
            const chatWindow = document.getElementById('chat-window');
            const isVisible = chatWindow.style.display === 'flex';
            chatWindow.style.display = isVisible ? 'none' : 'flex';
            
            // On mobile, prevent body scroll when chat is open
            if (window.innerWidth <= 480) {
                document.body.style.overflow = isVisible ? 'auto' : 'hidden';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = inputField.value.trim();
            if (!text) return;

            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML += `<div class="msg user">${text}</div>`;
            inputField.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            messagesDiv.innerHTML += `<div class="msg bot" id="${loadingId}">Thinking...</div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            inputField.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                document.getElementById(loadingId).innerText = data.response;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById(loadingId).innerText = "I'm having a little trouble connecting right now. Please try again in a moment, or reach out via WhatsApp!";
            }

            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.focus();
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
